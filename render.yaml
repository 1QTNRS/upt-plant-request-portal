# Render Blueprint for the UPT Plant Request Portal.
#
# Creates three resources:
#   - a managed PostgreSQL database (the portal's durable store)
#   - a Docker web service running the Shopify app
#   - a cron job that expires offers and sends expiration reminders
#
# Apply it from the Render Dashboard: New > Blueprint, pick this repository.
# Render prompts for every `sync: false` value on creation; no secret is
# committed here. See docs/PRODUCTION_DEPLOYMENT.md for the full runbook.
#
# app/lib/render-blueprint.test.ts checks this file against the app it deploys.

databases:
  - name: upt-portal-db
    databaseName: upt_portal
    user: upt_portal
    # Matches the PostgreSQL version the migrations are tested against.
    postgresMajorVersion: "16"
    region: oregon
    # basic-256mb is the smallest paid tier. The free tier is deliberately not
    # used: it is deleted after 30 days, which would take the portal's only
    # record of every plant request with it.
    plan: basic-256mb
    ipAllowList: [] # Private network only; nothing needs to reach it externally.

services:
  - type: web
    name: upt-plant-request-portal
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /healthz
    # Shopify OAuth sessions live in PostgreSQL, so more than one instance is
    # safe; start at one and scale if the storefront portal needs it.
    numInstances: 1
    # Only deploy commits whose CI passed. CI runs the full suite against both
    # SQLite and PostgreSQL, so a red build should not reach the store.
    autoDeployTrigger: checksPass
    envVars:
      # The Dockerfile serves on 3000; tell Render rather than relying on
      # port detection.
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: upt-portal-db
          property: connectionString
      # Shopify Partner dashboard > Apps > UPT Plant Request Portal >
      # Configuration. Render prompts for these on first apply.
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      # Must equal the App URL registered in Shopify, with no trailing slash.
      # Not derived from RENDER_EXTERNAL_URL because Shopify has to be told the
      # same value, and a custom domain would diverge from it.
      - key: SHOPIFY_APP_URL
        sync: false
      # Shared with the cron job below.
      - key: CRON_SECRET
        sync: false
      # Resend. Until the sending domain is verified, every message stays in the
      # EmailMessage outbox with status `preview` and no customer is notified.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: UPT_ADMIN_EMAIL
        sync: false

  - type: cron
    name: upt-offer-maintenance
    # The Node runtime avoids a second build of the app image; the script has no
    # dependencies, so nothing needs installing.
    runtime: node
    region: oregon
    # Render does not allow the free plan for cron jobs.
    plan: starter
    # Hourly. Safe to run this often: an expiration reminder is only ever sent
    # once per request, and expiring an already-expired offer is a no-op.
    schedule: "0 * * * *"
    buildCommand: "true"
    startCommand: node scripts/run-offer-maintenance.mjs
    autoDeployTrigger: checksPass
    envVars:
      # Pinned because Render otherwise resolves the Node version from
      # package.json `engines`, and that range (">=20.19 <22 || >=22.12") has no
      # upper bound: node-version-alias, the resolver Render uses, turns it into
      # the newest release in existence (26.7.0 today). "22" resolves to 22.23.2,
      # the same Node the Dockerfile's node:22-alpine runs.
      - key: NODE_VERSION
        value: "22"
      # Render runs `npm install` during a Node service's build by default. The
      # script imports nothing outside node: builtins, so installing the app's
      # dependency tree would only add a way for the job to fail.
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Where to send the request. Cron jobs do not get RENDER_EXTERNAL_URL, so
      # the web service's hostname is passed in explicitly.
      - key: APP_HOSTNAME
        fromService:
          name: upt-plant-request-portal
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      # Read from the web service so there is one value to rotate, not two.
      - key: CRON_SECRET
        fromService:
          name: upt-plant-request-portal
          type: web
          envVarKey: CRON_SECRET
